[project]
name = "fastapi-rest"
version = "1.0.0"
description = "Bookshelf REST API powered by FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.41",
  "pydantic-settings==2.10.1",
  "python-jose[cryptography]==3.5.0",
  "passlib[bcrypt]==1.7.4",
  "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "httpx==0.28.1",
  "ruff==0.12.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
# このプロジェクトでは可読性を考慮し、1行あたり最大120文字まで許可します。
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 有効化するルール:
# E/F: pycodestyle/pyflakes の基本的な品質チェック
# I: import の並び順チェック
# UP: 新しい Python 構文へのアップグレード提案
# B: bugbear のベストプラクティスチェック
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI では、関数引数のデフォルト値に Depends(...) や Query(...) を
# 使うのが一般的なため、依存性注入に対する B008 の誤検知を避ける目的で
# これらの呼び出しを安全なものとして扱います。
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
]

